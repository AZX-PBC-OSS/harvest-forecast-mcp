name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and publish (e.g. v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches version
        env:
          DIST_NAME: harvest-forecast-mcp
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/^version = "\(.*\)"$/\1/')
          echo "Distribution:   $DIST_NAME"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $PKG_VERSION for $DIST_NAME"
            exit 1
          fi
          echo "Tag matches package version"

      - name: Build package
        run: uv build

      - name: Smoke-test install from wheel
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python dist/*.whl
          cd /tmp && $GITHUB_WORKSPACE/test-env/bin/python -c "import harvest_forecast_mcp; print(harvest_forecast_mcp.__version__)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harvest-forecast-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
